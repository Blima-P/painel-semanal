  goalStatus().forEach(g => { if (!g.done && !g.metric) pend.push({ kind: 'goal', text: g.text, area: g.area, where: AREA[g.area]?.label || '' }); });
  dlgForm.innerHTML = `<h2 id="nwTitle">Começar nova semana?</h2>
    <p class="small">A semana <b>${fmtBR(state.week.start)}–${fmtBR(weekEnd())}</b> vai para o histórico e a semana <b>${fmtBR(start)}–${fmtBR(addDays(start, 6))}</b> começa com as atividades fixas e os hábitos desmarcados.</p>
    ${pend.length ? `<p class="small"><b>Levar para a nova semana?</b> Demandas vão para segunda; metas valem só para a próxima semana.</p>
      <label class="opt"><input type="checkbox" id="nwAll"> <b>Selecionar tudo</b></label>
      <div class="list">${pend.map((p, i) => `<label class="opt"><input type="checkbox" name="carry" value="${i}"><span>${p.kind === 'demand' ? '💼' : '🎯'} ${esc(p.text)} <span class="muted small">· ${esc(p.where)}</span></span></label>`).join('')}</div>`
      : `<p class="small muted">Nenhuma pendência — mandou bem! 🎉</p>`}
    <div class="actions"><button class="btn" value="cancel" type="submit" formnovalidate>Cancelar</button>
    <button class="btn primary" value="ok" type="submit" id="nwOk">Criar nova semana</button></div>`;
  dlgForm._pend = pend;
  dlg.returnValue = '';
  dlgForm.querySelector('#nwAll')?.addEventListener('change', ev => dlgForm.querySelectorAll('input[name=carry]').forEach(c => { c.checked = ev.target.checked; }));
  dlg.showModal();
}
// Fecha a folha deslizando pra baixo em vez de sumir de uma vez.
dlgForm.addEventListener('submit', e => {
  if (RM.matches) return;
  e.preventDefault();
  const v = e.submitter?.value || '';
  dlg.classList.add('closing');
  setTimeout(() => { dlg.classList.remove('closing'); dlg.close(v); }, 230);
});
dlg.addEventListener('close', () => {
  if (dlg.returnValue !== 'ok') return;
  const pend = dlgForm._pend || [], chosen = [...dlgForm.querySelectorAll('input[name=carry]:checked')].map(c => pend[Number(c.value)]);
  const from = `${fmtBR(state.week.start)}–${fmtBR(weekEnd())}`;
  startNewWeek({ demands: chosen.filter(p => p.kind === 'demand'), goals: chosen.filter(p => p.kind === 'goal') });
  ui.tab = 'dia'; render(); window.scrollTo(0, 0);
  toast(`Semana ${from} arquivada. Boa semana! 💪`);
});

/* ============================== Backup ============================== */
function downloadFile(text, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// No iPhone (app da tela inicial) o download por link só abre uma prévia sem opção de salvar,
// então usamos a folha de compartilhar, que tem "Salvar em Arquivos".
async function exportJSON() {
  const data = { app: 'painel-semanal', exportedAt: new Date().toISOString(), configVersion: CONFIG.configVersion, state };
  const text = JSON.stringify(data, null, 2), name = `painel-backup-${todayISO()}.json`;
  const done = msg => { localStorage.setItem(BACKUP_KEY, todayISO()); toast(msg); render(); };
  if (navigator.canShare && navigator.share) {
    for (const type of ['application/json', 'text/plain']) {
      const file = new File([text], name, { type });
      if (!navigator.canShare({ files: [file] })) continue;
      try { await navigator.share({ files: [file] }); done('Backup salvo'); }
      catch (e) {
        if (e.name === 'AbortError') return toast('Backup cancelado');
        downloadFile(text, name); done('Backup exportado');
      }
      return;
    }
  }
  downloadFile(text, name); done('Backup exportado');
}
document.getElementById('importFile').addEventListener('change', async e => {
  const file = e.target.files?.[0]; e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const s = data?.app === 'painel-semanal' ? data.state : data;
    if (!isValidState(s)) throw new Error('formato');
    if (!confirm(`Importar backup com a semana ${fmtBR(s.week.start)} e ${s.history.length} semana(s) no histórico? Os dados atuais serão substituídos.`)) return;
    hydrate(s); ui.day = defaultDay(); applyTheme(); commit(); toast('Backup importado ✔');
  } catch (err) {
    toast('Arquivo inválido. Use um JSON exportado pelo painel.');
  }
});

/* ============================== Widget (Scriptable) ============================== */
// O painel manda só um resumo (sequência, % de hoje e da semana) para um Gist privado;
// o widget do Scriptable (widget.js) lê esse Gist. A chave fica só neste aparelho e não vai no backup.
const WIDGET_KEY = 'painelSemanal.widget', WIDGET_FILE = 'painel-widget.json';
const widgetCfg = () => { try { return JSON.parse(localStorage.getItem(WIDGET_KEY)) || null; } catch (e) { return null; } };
const setWidgetCfg = v => v ? localStorage.setItem(WIDGET_KEY, JSON.stringify(v)) : localStorage.removeItem(WIDGET_KEY);
const patchWidgetCfg = v => { const cur = widgetCfg(); if (cur) setWidgetCfg({ ...cur, ...v }); };
const ghHeaders = token => ({ Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' });

function widgetData() {
  const t = todayISO(), st = weekStats(), map = dayPctMap(), s = dayStreak(map);
  const td = st.per.find(p => p.date === t);
  return {
    app: 'painel-semanal', v: 1, updated: new Date().toISOString(), today: t, minPct: streakMin(),
    streak: s.count, through: s.through, best: Math.max(bestStreak(map, t), s.count),
    todayPct: td ? td.pct : 0,
    areas: td ? Object.fromEntries(AREAS.map(a => [a.id, td.areas[a.id].pct])) : {},
    left: td ? Object.values(td.areas).reduce((a, x) => a + x.total - x.done, 0) : null,
    week: st.per.map(p => ({ d: p.date, pct: p.pct, rest: isRest(weekdayIdx(p.date)) }))
  };
}

let wTimer = null, wSent = null, wScript = null;
function queueWidgetSync() {
  if (!widgetCfg()?.gistId) return;
  clearTimeout(wTimer); wTimer = setTimeout(syncWidget, 2500);
}
async function syncWidget(force) {
  clearTimeout(wTimer);
  const w = widgetCfg();
  if (!w?.gistId) return false;
  const data = widgetData(), key = JSON.stringify({ ...data, updated: null });
  if (!force && key === wSent) return true;
  try {
    const r = await fetch(`https://api.github.com/gists/${encodeURIComponent(w.gistId)}`, {
      method: 'PATCH', headers: ghHeaders(w.token), body: JSON.stringify({ files: { [WIDGET_FILE]: { content: JSON.stringify(data) } } })
    });
    if (!r.ok) throw new Error(r.status === 401 ? 'chave expirada ou inválida' : r.status === 404 ? 'Gist não encontrado' : `erro ${r.status}`);
    wSent = key; patchWidgetCfg({ lastSync: new Date().toISOString(), error: null });
    return true;
  } catch (e) {
    patchWidgetCfg({ error: e instanceof TypeError ? 'sem conexão' : e.message });
    return false;
  }
}
async function connectWidget(token) {
  token = token.trim();
  if (!/^(gh[pousr]_|github_pat_)\w{20,}$/.test(token)) return toast('Essa chave não parece do GitHub (começa com ghp_)');
  toast('Conectando…');
  try {
    const r = await fetch('https://api.github.com/gists', {
      method: 'POST', headers: ghHeaders(token),
      body: JSON.stringify({ description: 'Painel Semanal: dados do widget (só números)', public: false, files: { [WIDGET_FILE]: { content: JSON.stringify(widgetData()) } } })
    });
    if (r.status === 401) throw new Error('Chave inválida ou expirada');
    if (r.status === 403 || r.status === 404) throw new Error('A chave precisa da permissão "gist"');
    if (!r.ok) throw new Error(`GitHub respondeu ${r.status}`);
    const g = await r.json();
    setWidgetCfg({ token, gistId: g.id, owner: g.owner?.login || '', lastSync: new Date().toISOString(), error: null });
    wSent = null; ui.open.add('ed-widget'); render(); toast('Widget conectado ✓');
    loadWidgetScript().catch(() => {});
  } catch (e) {
    toast(e instanceof TypeError ? 'Sem conexão com o GitHub' : e.message);
  }
}
function loadWidgetScript() {
  if (wScript) return Promise.resolve(wScript);
  return fetch('widget.js').then(r => r.ok ? r.text() : Promise.reject(new Error(r.status))).then(t => (wScript = t));
}
const fillScript = (t, w) => t.replace("'__GIST__'", `'${w.gistId}'`).replace("'__OWNER__'", `'${w.owner}'`);
async function copyWidgetScript() {
  const w = widgetCfg();
  if (!w) return;
  try {
    if (wScript) await navigator.clipboard.writeText(fillScript(wScript, w));
    else await navigator.clipboard.write([new ClipboardItem({ 'text/plain': loadWidgetScript().then(t => new Blob([fillScript(t, w)], { type: 'text/plain' })) })]);
    toast('Script copiado. Agora cole no Scriptable');
  } catch (e) {
    // sem permissão de área de transferência: mostra o texto para copiar na mão
    const ta = document.getElementById('wScriptTa');
    try { ta.value = fillScript(await loadWidgetScript(), w); } catch (_) { return toast('Não consegui carregar o script. Tem internet?'); }
    ta.hidden = false; ta.focus(); ta.select(); toast('Toque e segure no texto → Selecionar tudo → Copiar');
  }
}
function widgetSection() {
  const w = widgetCfg(), min = Math.round(streakMin() * 100);
  if (!w) return `<p class="small">Mostre sua <b>sequência de dias</b> e o progresso de hoje na tela de início, com um widget do app gratuito <b>Scriptable</b>. O painel manda só números (% e sequência) para um Gist privado no seu GitHub.</p>
    <ol class="steps small">
      <li>Instale o <a href="https://apps.apple.com/app/scriptable/id1405459188" target="_blank" rel="noopener">Scriptable</a> na App Store.</li>
      <li><a href="https://github.com/settings/tokens/new?description=Painel%20widget&scopes=gist" target="_blank" rel="noopener">Crie uma chave no GitHub</a>: deixe marcado só <b>gist</b>, escolha a validade (pode ser <i>No expiration</i>), toque em <b>Generate token</b> e copie a chave.</li>
      <li>Volte aqui, cole a chave e toque em <b>Conectar</b>.</li>
    </ol>
    <form class="row" data-widget-connect><input type="password" name="token" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ghp_…" aria-label="Chave do GitHub" style="flex:1;min-width:0"><button class="btn primary" type="submit">Conectar</button></form>
    <p class="muted small">A sequência conta os dias com pelo menos ${min}% feito.</p>`;
  const when = w.lastSync ? new Date(w.lastSync).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'ainda não';
  return `<p class="small"><b>Conectado ✓</b> · atualizado ${esc(when)}${w.error ? ` · <span class="err">${esc(w.error)}</span>` : ''}</p>
    <ol class="steps small">
      <li>Toque em <b>Copiar script</b>.</li>
      <li>Abra o <b>Scriptable</b>, toque em <b>+</b>, cole o texto, toque no título lá em cima e renomeie para <b>Painel</b>. Toque em <b>OK</b>.</li>
      <li>Na tela de início, segure num espaço vazio → <b>Editar</b> → <b>Adicionar widget</b> → <b>Scriptable</b> → escolha pequeno ou médio → <b>Adicionar widget</b>.</li>
      <li>Toque no widget novo e, em <b>Script</b>, escolha <b>Painel</b>. Pronto!</li>
    </ol>
    <div class="row" style="flex-wrap:wrap"><button type="button" class="btn primary" data-act="widget-copy">Copiar script</button>
    <button type="button" class="btn" data-act="widget-sync">Atualizar agora</button>
    <button type="button" class="btn danger" data-act="widget-off">Desconectar</button></div>
    <textarea id="wScriptTa" class="script-ta" readonly hidden aria-label="Script do widget"></textarea>
    <p class="muted small">O widget se atualiza sozinho a cada ~15 min (quem decide a hora exata é o iPhone). Também dá pra pôr na tela bloqueada. A sequência conta os dias com pelo menos ${min}% feito.</p>`;
}

/* ============================== Início ============================== */
load();
ui.day = defaultDay();
applyTheme();
render();
navigator.storage?.persist?.().catch(() => {});

const navObs = () => document.body.classList.toggle('scrolled', window.scrollY > 44);
window.addEventListener('scroll', navObs, { passive: true });

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) render();
  syncWidget(); // ao abrir (o dia pode ter virado) e ao sair do app
});
if (widgetCfg()) { setTimeout(syncWidget, 1500); loadWidgetScript().catch(() => {}); }

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const watch = w => w && w.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) { ui.swWaiting = w; render(); }
      });
      if (reg.waiting && navigator.serviceWorker.controller) { ui.swWaiting = reg.waiting; render(); }
      reg.addEventListener('updatefound', () => watch(reg.installing));
    }).catch(() => {});
    let reloaded = false;
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadController && !reloaded) { reloaded = true; location.reload(); }
    });
  });
}
