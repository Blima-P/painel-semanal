<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel Semanal</title>
<meta name="description" content="Painel semanal de hábitos, metas e tarefas">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Painel">

<script>
/* =====================================================================
   CONFIGURAÇÃO — edite aqui (ou peça ao agente na "rotina de segunda").
   - Sempre que mudar algo, aumente o configVersion (+1). O app aplica as
     mudanças sem apagar histórico, marcações nem o que você editou no painel.
   - Dias da semana são índices: 0=Seg 1=Ter 2=Qua 3=Qui 4=Sex 5=Sáb 6=Dom.
   - Datas no formato 'AAAA-MM-DD'.
   ===================================================================== */
const CONFIG = {
  configVersion: 1,
  weekStart: '2026-10-26', // segunda-feira da semana atual

  // Lista curta do que mudou nesta versão (aparece uma vez no app)
  changelog: [],

  settings: {
    workStartTime: '08:00',     // horário de chegada no trabalho
    wakeTarget: '05:00',        // horário-alvo para acordar
    waterGoalLiters: 6,         // meta diária de água (L)
    bottleLiters: 1,            // tamanho da garrafa do contador (L)
    studyStep: 0.5,             // passo do contador de estudo (h)
    studySplit: [               // divisão das horas diárias de estudo
      { id: 'aws',    label: 'AWS Cloud Practitioner', hours: 2 },
      { id: 'ingles', label: 'Inglês',                 hours: 1 }
    ],
    workDays:  [0, 1, 2, 3, 4], // dias úteis (seg–sex)
    studyDays: [0, 1, 2, 3, 4, 5], // dias com meta de estudo (seg–sáb)
    restDays:  [6],             // descanso total (domingo)
    streakMinPct: 0.8           // % mínimo do dia para contar na sequência (widget)
  },

  // Metas semanais. "metric" = progresso calculado automaticamente.
  goals: [
    { id: 'g-trab-horario',  area: 'trabalho', text: 'Chegar no horário todos os dias úteis', metric: 'onTime' },
    { id: 'g-trab-demandas', area: 'trabalho', text: 'Entregar o máximo de demandas por dia', metric: 'demands' },
    { id: 'g-saude-treino',  area: 'saude',    text: 'Treinar e correr todos os dias (seg a sáb)', metric: 'training' },
    { id: 'g-saude-descanso',area: 'saude',    text: 'Domingo de descanso total (sem treino)' },
    { id: 'g-aws-horas',     area: 'estudos',  text: 'AWS: 12 h de estudo na semana', metric: 'study:aws' },
    { id: 'g-aws-d3',        area: 'estudos',  text: 'AWS: revisar Domínio 3 – Tecnologia e Serviços (EC2, S3, RDS, Lambda, VPC)' },
    { id: 'g-aws-d4',        area: 'estudos',  text: 'AWS: estudar Domínio 4 – Cobrança, Preços e Suporte (Pricing Calculator, Organizations, planos de suporte)' },
    { id: 'g-aws-simulados', area: 'estudos',  text: 'AWS: fazer 2 simulados completos (meta ≥ 75%) e revisar os erros' },
    { id: 'g-ing-horas',     area: 'estudos',  text: 'Inglês: 6 h de estudo na semana', metric: 'study:ingles' },
    { id: 'g-ing-listening', area: 'estudos',  text: 'Inglês: 3 sessões de listening sem legenda em português' },
    { id: 'g-ing-vocab',     area: 'estudos',  text: 'Inglês: 30 palavras/expressões de TI e cloud (flashcards)' },
    { id: 'g-ing-pratica',   area: 'estudos',  text: 'Inglês: 1 conversa ou texto curto + ler a documentação da AWS em inglês' }
  ],

  // Atividades fixas por dia da semana (0=Seg ... 6=Dom)
  fixed: [
    [{ id: 'fx-muay', text: 'Muay thai', icon: '🥊' }, { id: 'fx-academia', text: 'Academia', icon: '🏋️' }],
    [{ id: 'fx-correr', text: 'Correr', icon: '🏃' }, { id: 'fx-academia', text: 'Academia', icon: '🏋️' }],
    [{ id: 'fx-muay', text: 'Muay thai', icon: '🥊' }, { id: 'fx-academia', text: 'Academia', icon: '🏋️' }],
    [{ id: 'fx-correr', text: 'Correr', icon: '🏃' }, { id: 'fx-academia', text: 'Academia', icon: '🏋️' }],
    [{ id: 'fx-muay', text: 'Muay thai', icon: '🥊' }, { id: 'fx-academia', text: 'Academia', icon: '🏋️' }],
    [{ id: 'fx-academia', text: 'Academia', icon: '🏋️' }, { id: 'fx-correr', text: 'Correr', icon: '🏃' }],
    [] // Domingo: descanso total
  ],

  // Treinos diferentes do padrão em datas específicas. Ex.:
  // '2026-10-28': [{ id: 'fx-correr', text: 'Correr', icon: '🏃' }]
  fixedOverrides: {},

  // Demandas de trabalho por dia. Ex.:
  // '2026-10-26': [{ id: 'd-2610-1', text: 'Enviar relatório X' }]
  demands: {},

  // Compromissos, provas e prazos por dia. Ex.:
  // '2026-10-30': [{ id: 'e-3010-1', text: '19h – simulado AWS' }]
  events: {},

  // Hábitos diários. type: check | water | study | wake
  // when: all (todo dia) | training (dias de treino) | study (dias de estudo)
  habits: [
    { id: 'h-agua',       icon: '💧', label: 'Beber 6 L de água',       type: 'water', when: 'all',      enabled: true },
    { id: 'h-sono',       icon: '😴', label: 'Dormir 7 a 8 horas',      type: 'check', when: 'all',      enabled: true },
    { id: 'h-exercicio',  icon: '🏃', label: 'Exercício físico',        type: 'check', when: 'training', enabled: true },
    { id: 'h-estudo',     icon: '📚', label: 'Estudar pelo menos 3 h',  type: 'study', when: 'study',    enabled: true },
    { id: 'h-acordar',    icon: '⏰', label: 'Acordar cedo',            type: 'wake',  when: 'all',      enabled: true },
    { id: 'h-comida',     icon: '🥗', label: 'Comer saudável',          type: 'check', when: 'all',      enabled: true },
    // Extras sugeridos (ative/desative em Editar → Hábitos)
    { id: 'h-planejar',   icon: '📝', label: 'Planejar o dia (5 min)',          type: 'check', when: 'all', enabled: true, extra: true },
    { id: 'h-leitura',    icon: '📖', label: 'Ler 20 minutos',                  type: 'check', when: 'all', enabled: true, extra: true },
    { id: 'h-sem-celular',icon: '📵', label: 'Sem celular 1 h antes de dormir', type: 'check', when: 'all', enabled: true, extra: true }
  ]
};
</script>

<style>
:root {
  --bg: #f2f2f7; --card: #ffffff; --text: #000000; --muted: #6c6c70; --sep: rgba(60, 60, 67, .2);
  --fill: rgba(118, 118, 128, .12); --fill2: rgba(120, 120, 128, .2); --ring-off: #8e8e93;
  --primary: #0071e3; --btn: #0071e3; --on-primary: #ffffff;
  --ok: #34c759; --ok-text: #248a3d; --on-ok: #ffffff; --danger: #ff3b30; --danger-text: #d70015; --today: #d70015;
  --track: rgba(118, 118, 128, .16); --water: #32ade6;
  --c-trabalho: #007aff; --c-saude: #ff2d55; --c-estudos: #af52de; --c-habitos: #ff9500;
  --bar-bg: rgba(249, 249, 249, .8); --shadow-pop: 0 10px 30px rgba(0, 0, 0, .12);
  --radius: 16px;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --text: #ffffff; --muted: #a1a1a8; --sep: rgba(84, 84, 88, .6);
  --fill: rgba(118, 118, 128, .24); --fill2: rgba(120, 120, 128, .36); --ring-off: #7c7c82;
  --primary: #409cff; --btn: #0a6ad8; --on-primary: #ffffff;
  --ok: #30d158; --ok-text: #30d158; --on-ok: #ffffff; --danger: #ff453a; --danger-text: #ff6961; --today: #ff453a;
  --track: rgba(118, 118, 128, .3); --water: #64d2ff;
  --c-trabalho: #0a84ff; --c-saude: #ff375f; --c-estudos: #bf5af2; --c-habitos: #ff9f0a;
  --bar-bg: rgba(22, 22, 24, .8); --shadow-pop: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  letter-spacing: -.01em; -webkit-font-smoothing: antialiased;
  padding-bottom: calc(92px + env(safe-area-inset-bottom));
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.row .grow { flex: 1; min-width: 0; }
.blur { background: var(--bar-bg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }

/* ---------- barra superior compacta + título grande ---------- */
.navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 15; display: flex; justify-content: center; align-items: flex-end;
  padding-top: env(safe-area-inset-top); height: calc(44px + env(safe-area-inset-top));
  border-bottom: .5px solid var(--sep); opacity: 0; pointer-events: none; transition: opacity .2s;
}
.navbar span { font-weight: 600; line-height: 44px; }
body.scrolled .navbar { opacity: 1; }
header.top {
  max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 12px;
  padding: calc(14px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
}
header.top .eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .02em; }
header.top h1 { font-size: 34px; font-weight: 700; letter-spacing: .01em; line-height: 1.12; margin: 2px 0 0; }
.icon-btn {
  flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--fill); color: var(--primary);
  display: grid; place-items: center; margin-bottom: 2px;
}
.icon-btn svg { width: 22px; height: 22px; }
main { max-width: 760px; margin: 0 auto; padding: 4px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }

/* ---------- tab bar ---------- */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; border-top: .5px solid var(--sep);
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
nav.tabs button {
  flex: 1; min-height: 54px; padding: 7px 0 4px; border: 0; background: none; color: var(--muted);
  font-size: 11px; font-weight: 500; letter-spacing: .01em;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px;
}
nav.tabs svg { width: 27px; height: 27px; }
nav.tabs button[aria-current="page"] { color: var(--primary); }
nav.tabs button:active svg { transform: scale(.88); }
nav.tabs svg { transition: transform .15s; }

/* ---------- cards (lista agrupada) ---------- */
.card { background: var(--card); border-radius: var(--radius); padding: 0 16px 14px; margin: 0 0 20px; overflow: hidden; }
.card > h2, .card > h3 {
  margin: 0; padding: 14px 0 8px; font-size: 20px; font-weight: 700; letter-spacing: .01em;
  display: flex; align-items: center; gap: 10px; line-height: 1.2;
}
.card > p { margin: 6px 0 10px; }
.tile {
  flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-size: 17px;
  background: color-mix(in srgb, var(--accent, var(--primary)) 18%, transparent);
}
.card.area-trabalho, .area-trabalho { --accent: var(--c-trabalho); }
.card.area-saude, .area-saude       { --accent: var(--c-saude); }
.card.area-estudos, .area-estudos   { --accent: var(--c-estudos); }
.card.area-habitos, .area-habitos   { --accent: var(--c-habitos); }
.stack { display: grid; }
.card > .stack { margin: 0 -16px; }
.card > .stack > p, .card > .stack > .sub-h, .card > .stack > .note { margin: 0; padding: 8px 16px; }
.card > .stack > .total { padding: 10px 16px 4px; }
.sec-h { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .02em; margin: 0 0 6px; padding: 0 16px; }

/* ---------- linhas marcáveis (estilo Lembretes) ---------- */
.check, .counter-row {
  position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 54px;
  padding: 10px 16px; border: 0; background: transparent; text-align: left; transition: background .15s;
}
.check::after, .counter-row::after, .daycard::after {
  content: ""; position: absolute; left: 56px; right: 0; bottom: 0; height: .5px; background: var(--sep);
}
.check:last-child::after, .counter-row:last-child::after, .daycard:last-child::after { display: none; }
button.check:active { background: var(--fill); }
.check .box, .counter-row .box { flex: none; position: relative; display: block; width: 26px; height: 26px; }
.box > svg { display: block; width: 100%; height: 100%; overflow: visible; transition: transform .18s cubic-bezier(.3, .7, .3, 1.3); }
button.check:active .box > svg { transform: scale(.86); }
.box .o { fill: transparent; stroke: var(--ring-off); stroke-width: 1.8; }
.box .p { fill: none; stroke: var(--accent, var(--ok)); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 75.4; stroke-dashoffset: 75.4; }
.box .m { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 17; stroke-dashoffset: 17; }
.check.done .box .o { fill: var(--accent, var(--ok)); stroke: var(--accent, var(--ok)); }
.check.done .box .m { stroke-dashoffset: 0; }
.check .lbl { flex: 1; min-width: 0; }
.check .lbl small, .counter-row .lbl small { display: block; color: var(--muted); font-size: 14px; margin-top: 1px; }
.check.done > .lbl { color: var(--muted); }
.na-line { padding: 10px 16px 4px !important; }
.rest-msg { padding: 14px 16px !important; }
.tag {
  display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; font-weight: 600;
  background: var(--fill); margin-left: 4px; vertical-align: middle; white-space: nowrap;
}
.streak { flex: none; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
.counter-row .lbl { flex: 1; min-width: 0; }
.counter-row.done .lbl small { color: var(--ok-text); font-weight: 600; }
.counter { display: flex; align-items: center; gap: 8px; flex: none; }
.counter button {
  width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--fill); color: var(--primary);
  font-size: 24px; font-weight: 400; line-height: 1; display: grid; place-items: center; padding: 0 0 2px;
  transition: transform .18s cubic-bezier(.3, .7, .3, 1.4), background-color .15s;
}
.counter button:active { background: var(--fill2); transform: scale(.86); }

/* ---------- anel único (cards, contadores, faixa da semana) ---------- */
.ring1 { display: block; width: 100%; height: 100%; overflow: visible; }
.ring1 circle, .rings circle { fill: none; stroke-linecap: round; }
.ring1 .tick { fill: none; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 56; stroke-dashoffset: 56; }
.ring1.full .tick { stroke-dashoffset: 0; }
.arc.z { opacity: 0; }
.card > h3 .ring1 { width: 26px; height: 26px; flex: none; }
.cnt { margin-left: auto; font-size: 15px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- adicionar rápido (estilo Lembretes) ---------- */
.card > .stack > .add-form.quick { display: flex; align-items: center; flex-wrap: nowrap; gap: 14px; margin: 0; padding: 3px 16px; min-height: 52px; }
.plus { flex: none; position: relative; width: 26px; height: 26px; border-radius: 50%; background: var(--fill); }
.plus::before, .plus::after { content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 2px; border-radius: 2px; background: var(--muted); transform: translate(-50%, -50%); }
.plus::after { transform: translate(-50%, -50%) rotate(90deg); }
.add-form.quick input[type=text] { flex: 1; min-width: 0; background: none; padding: 0; border-radius: 0; }
.add-form.quick input::placeholder { color: var(--muted); }
.add-go {
  flex: none; border: 0; border-radius: 99px; min-height: 34px; padding: 0 14px; background: var(--btn); color: var(--on-primary);
  font-size: 15px; font-weight: 600; transition: opacity .2s, transform .3s cubic-bezier(.3, .7, .3, 1.3);
}
.add-form.quick input:placeholder-shown + .add-go { opacity: 0; transform: scale(.6); pointer-events: none; }

/* ---------- barras e anéis ---------- */
.bar { display: block; height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 99px; background: var(--primary); transition: width .45s cubic-bezier(.2, .8, .2, 1); }
.bar.lg { height: 10px; }
.mini { display: block; margin-top: 6px; height: 5px; }
.prog { display: grid; grid-template-columns: 84px 1fr 46px; align-items: center; gap: 10px; font-size: 15px; margin: 8px 0; }
.prog .v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.rings { flex: none; display: block; overflow: visible; }
.hero { display: flex; align-items: center; gap: 22px; padding: 20px 2px 6px; }
.hero .rings { width: 132px; height: 132px; }
.hero-k { font-size: 15px; font-weight: 500; color: var(--muted); }
.big { font-size: 52px; font-weight: 700; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; display: block; }
.hero .sub { font-size: 15px; color: var(--muted); margin-top: 2px; }
.legend4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 14px; padding-top: 12px; border-top: .5px solid var(--sep); text-align: center; }
.legend4 .lg > :first-child { display: block; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; }
.legend4 .lg.na > :first-child { font-size: 15px; line-height: 1.65; color: var(--muted); }
.legend4 .lg > :last-child { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--muted); }
.legend4 i { width: 7px; height: 7px; border-radius: 50%; flex: none; }

/* ---------- faixa da semana (estilo Fitness/Calendário) ---------- */
.chips { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin: 0 -4px 16px; }
.chip {
  border: 0; background: none; border-radius: 14px; padding: 6px 0 8px; min-height: 64px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text);
}
.chip:active { background: var(--fill); }
.chip .wd { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
.chip .nr { position: relative; width: 40px; height: 40px; display: grid; place-items: center; transition: transform .2s cubic-bezier(.3, .7, .3, 1.4); }
.chip:active .nr { transform: scale(.9); }
.chip .nr .ring1 { position: absolute; inset: 0; }
.chip .n {
  font-size: 15px; font-weight: 600; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; font-variant-numeric: tabular-nums; transition: background-color .25s, color .25s;
}
.chip.today .wd, .chip.today .n { color: var(--today); }
.chip[aria-pressed="true"] .n { background: var(--text); color: var(--bg); }
.chip.today[aria-pressed="true"] .n { background: var(--today); color: #fff; }

/* ---------- semana: lista de dias ---------- */
.daylist { background: var(--card); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
.daycard {
  position: relative; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0;
  background: none; padding: 10px 12px 10px 14px; min-height: 68px;
}
.daycard::after { left: 70px; }
.daycard:active { background: var(--fill); }
.daycard .rings { width: 44px; height: 44px; }
.daycard .dring { flex: none; width: 34px; height: 34px; margin: 0 4px; }
.goals-d { margin-bottom: 22px; }
.goals-d > summary { font-size: 17px; }
.goals-d > summary .ring1 { width: 26px; height: 26px; flex: none; }
details.goals-d > summary::after { margin-left: 10px; }
.goals-d .inner > .stack { margin: 0 -16px; }
.goals-d .inner > .goal-area:first-child { margin-top: 8px; }
details.opening > .inner { animation: fadein .4s cubic-bezier(.2, .8, .2, 1); }
.daycard .info { flex: 1; min-width: 0; display: block; }
.daycard .head { display: flex; align-items: baseline; gap: 6px; }
.daycard .head b { font-weight: 600; }
.daycard.today .head b { color: var(--today); }
.daycard .meta { display: block; font-size: 14px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.daycard .pct { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }
.chev { flex: none; width: 9px; height: 9px; border-right: 2.5px solid var(--ring-off); border-bottom: 2.5px solid var(--ring-off); transform: rotate(-45deg); margin: 0 4px 0 2px; }
.goal-area { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .02em; margin: 16px 0 2px; }
.goal-area i { width: 8px; height: 8px; border-radius: 50%; }

/* ---------- gráficos ---------- */
.donut { margin: 0; text-align: center; }
.donut svg { width: 100%; max-width: 92px; display: block; margin: 0 auto; }
.donut .track { fill: none; stroke: var(--track); stroke-width: 11; }
.donut .arc { fill: none; stroke-width: 11; stroke-linecap: round; transition: stroke-dasharray .5s ease; }
.donut .donut-txt { font-size: 19px; font-weight: 700; fill: var(--text); }
.donut figcaption { font-size: 13px; color: var(--muted); margin-top: 4px; font-weight: 600; }
.donut-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 8px; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--sep); stroke-width: 1; stroke-dasharray: 3 4; }
.chart .axis { fill: var(--muted); font-size: 10px; font-weight: 500; }
.chart .axis-hl { fill: var(--today); font-weight: 700; }
.chart .val { fill: var(--text); font-size: 10px; font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; margin-top: 8px; color: var(--muted); font-weight: 500; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.heat { width: 100%; border-collapse: separate; border-spacing: 3px; font-size: 13px; }
.heat th { font-weight: 600; color: var(--muted); }
.heat th.h { text-align: left; font-weight: 500; color: var(--text); max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.heat td { height: 24px; width: 24px; min-width: 24px; border-radius: 7px; text-align: center; font-weight: 700; font-size: 12px; }
.heat td.c-done { background: var(--ok); color: #fff; }
.heat td.c-part { background: color-mix(in srgb, var(--ok) 35%, var(--track)); }
.heat td.c-miss { background: var(--track); }
.heat td.c-future { background: transparent; box-shadow: inset 0 0 0 1px var(--sep); }
.heat td.c-na { background: transparent; color: var(--muted); }
.heat td.st { font-weight: 700; white-space: nowrap; }
table.cmp { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
table.cmp th, table.cmp td { padding: 10px 4px; border-bottom: .5px solid var(--sep); text-align: right; }
table.cmp th { font-size: 13px; color: var(--muted); font-weight: 600; }
table.cmp tr:last-child td { border-bottom: 0; }
table.cmp th:first-child, table.cmp td:first-child { text-align: left; }
.up { color: var(--ok-text); font-weight: 700; } .down { color: var(--danger-text); font-weight: 700; }

/* ---------- avisos ---------- */
.banner {
  border-radius: var(--radius); padding: 14px 16px; margin: 0 0 16px; color: var(--text);
  background: color-mix(in srgb, var(--c-habitos) 14%, var(--card));
}
.banner.rest { background: color-mix(in srgb, var(--ok) 14%, var(--card)); }
.banner.info { background: color-mix(in srgb, var(--primary) 12%, var(--card)); }
.banner ul { margin: 6px 0 8px; padding-left: 20px; }
.banner .row { margin-top: 10px; flex-wrap: wrap; }

/* ---------- botões ---------- */
.btn {
  min-height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--fill); color: var(--primary);
  font-weight: 600; font-size: 17px; transition: opacity .15s, transform .15s;
}
.btn:active, .icon-btn:active { opacity: .6; }
.btn.primary { background: var(--btn); color: var(--on-primary); }
.btn.danger { color: var(--danger-text); background: color-mix(in srgb, var(--danger) 13%, transparent); }
.btn.block { width: 100%; min-height: 52px; border-radius: 14px; }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: 15px; border-radius: 99px; }
.tbtn { margin-left: auto; min-height: 44px; padding: 0 2px 0 10px; border: 0; background: none; color: var(--primary); font-size: 17px; font-weight: 400; }
.tbtn[aria-expanded="true"] { font-weight: 600; }
.tbtn:active { opacity: .5; }

/* ---------- editor (estilo Ajustes) ---------- */
details.sec { background: var(--card); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
details.sec > summary {
  list-style: none; padding: 8px 16px; min-height: 54px; font-weight: 600; display: flex; align-items: center; gap: 12px; cursor: pointer;
}
details.sec > summary:active { background: var(--fill); }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::after {
  content: ""; width: 9px; height: 9px; border-right: 2.5px solid var(--ring-off); border-bottom: 2.5px solid var(--ring-off);
  transform: rotate(-45deg); margin-left: auto; margin-right: 4px; transition: transform .25s; flex: none;
}
details.sec[open] > summary::after { transform: rotate(45deg); }
details.sec[open] > summary { border-bottom: .5px solid var(--sep); }
details.sec > .inner { padding: 6px 16px 16px; }
.ed-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 0; border-bottom: .5px solid var(--sep); }
.ed-row:last-of-type { border-bottom: 0; }
.ed-row input[type=text], .ed-row select { min-width: 0; }
.ed-row input[type=text]:not(.ico-in) { order: -1; flex: 1 1 100%; }
.ed-row .ico-in { width: 56px; flex: none; text-align: center; }
.ed-row .push { margin-left: auto; }
input[type=text], input[type=time], input[type=number], input[type=password], select {
  min-height: 44px; border: 0; border-radius: 10px; background: var(--fill); padding: 0 12px; font-size: 17px;
}
.steps { margin: 8px 0 12px; padding-left: 22px; }
.steps li { margin: 6px 0; }
.steps a { color: var(--primary); }
.script-ta { width: 100%; height: 150px; margin-top: 10px; border: 0; border-radius: 10px; background: var(--fill); color: inherit; padding: 10px; font: 12px/1.4 ui-monospace, Menlo, monospace; }
.err { color: var(--danger-text); }
.streak-l { margin-top: 6px; font-size: 14px; font-weight: 600; color: var(--c-habitos); }
select { -webkit-appearance: none; appearance: none; padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 17px) 52%, calc(100% - 12px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.ed-btn {
  flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--fill); color: var(--primary);
  font-size: 18px; padding: 0; display: grid; place-items: center;
}
.ed-btn:disabled { opacity: .3; cursor: default; }
.ed-btn.del { color: var(--danger-text); background: color-mix(in srgb, var(--danger) 13%, transparent); }
.add-form { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.card > .stack > .add-form { padding: 6px 16px 4px; margin: 0; }
.add-form input[type=text] { flex: 1 1 150px; }
.add-form .ico-in { flex: 0 0 56px; text-align: center; }
.sub-h { font-weight: 600; margin: 16px 0 4px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .02em; }
.sub-h:first-child { margin-top: 4px; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: .5px solid var(--sep); }
.field:last-child { border-bottom: 0; }
.field input, .field select { flex: none; max-width: 55%; }
.switch {
  position: relative; flex: none; width: 65px; height: 45px; border-radius: 99px; padding: 0;
  border: 7px solid transparent; background: var(--fill2); background-clip: padding-box; transition: background-color .25s;
}
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
  box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 1px 1px rgba(0, 0, 0, .16); transition: transform .25s cubic-bezier(.3, .7, .3, 1.2);
}
.switch[aria-pressed="true"] { background-color: var(--ok); }
.switch[aria-pressed="true"]::after { transform: translateX(20px); }

/* ---------- toast e folha (sheet) ---------- */
#toast {
  position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top)); transform: translate(-50%, -16px) scale(.96);
  background: var(--card); color: var(--text); padding: 12px 20px; border-radius: 99px; font-size: 15px; font-weight: 600;
  box-shadow: var(--shadow-pop); opacity: 0; pointer-events: none; transition: opacity .25s, transform .3s cubic-bezier(.2, .9, .3, 1.2);
  z-index: 50; max-width: 90vw; text-align: center;
}
#toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
dialog {
  border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 600px; max-height: 90vh;
  border-radius: 16px 16px 0 0; background: var(--bg); color: var(--text);
}
dialog[open] { animation: sheet .35s cubic-bezier(.2, .9, .3, 1); }
@keyframes sheet { from { transform: translateY(100%); } }
dialog::backdrop { background: rgba(0, 0, 0, .4); }
dialog .dlg { padding: 10px 16px calc(16px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
dialog .dlg::before { content: ""; justify-self: center; width: 36px; height: 5px; border-radius: 3px; background: var(--ring-off); opacity: .5; }
dialog .dlg h2 { margin: 0; font-size: 22px; font-weight: 700; }
dialog .dlg p { margin: 0; }
dialog .list { max-height: 40vh; overflow: auto; display: block; background: var(--card); border-radius: 12px; }
dialog label.opt { display: flex; gap: 12px; align-items: center; min-height: 50px; padding: 10px 14px; background: var(--card); border-radius: 12px; }
dialog .list label.opt { border-radius: 0; border-bottom: .5px solid var(--sep); }
dialog .list label.opt:last-child { border-bottom: 0; }
dialog label.opt input { width: 24px; height: 24px; flex: none; accent-color: var(--primary); }
dialog .actions { display: grid; gap: 8px; }
dialog .actions .btn { min-height: 52px; border-radius: 14px; }
dialog .actions .primary { order: -1; }

/* ---------- animações ---------- */
/* check: o anel se completa → preenche → ✓ é desenhado → quiquezinho + onda */
@keyframes ringDraw { from { stroke-dashoffset: 75.4; } to { stroke-dashoffset: 0; } }
@keyframes fillIn { from { fill: transparent; stroke: var(--ring-off); } }
@keyframes tickDraw { from { stroke-dashoffset: 17; } }
@keyframes boing { 40% { transform: scale(1.2); } 70% { transform: scale(.95); } }
@keyframes ripple { from { transform: scale(1); opacity: .45; } to { transform: scale(2.2); opacity: 0; } }
@keyframes flash { from { background-color: color-mix(in srgb, var(--accent, var(--ok)) 13%, transparent); } }
@keyframes dim { from { color: var(--text); } }
@keyframes unfill { from { fill: var(--accent, var(--ok)); stroke: var(--accent, var(--ok)); } }
@keyframes shrink { from { transform: scale(.8); } }
.check.pop { animation: flash 1s ease-out; }
.check.pop .box .p { animation: ringDraw .36s cubic-bezier(.45, 0, .2, 1) both; }
.check.pop .box .o { animation: fillIn .2s .32s ease-out backwards; }
.check.pop .box .m { animation: tickDraw .28s .44s cubic-bezier(.3, .6, .3, 1) backwards; }
.check.pop .box > svg { animation: boing .5s .34s cubic-bezier(.3, .7, .3, 1.2); }
.check.pop .box::after, .counter-row.reach .box::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent, var(--ok)); opacity: 0;
  animation: ripple .6s .36s ease-out;
}
.counter-row.reach .box::after { animation-delay: .55s; }
.check.pop > .lbl { animation: dim .5s .3s ease backwards; }
.check.unpop .box .o { animation: unfill .3s ease; }
.check.unpop .box > svg { animation: shrink .35s cubic-bezier(.3, .7, .3, 1.4); }
.counter-row.reach { animation: flash 1.1s .4s ease-out backwards; }

/* anel fechou 100% → pulinho e ✓ aparece */
@keyframes burst { 40% { transform: scale(1.2); } 75% { transform: scale(.96); } }
@keyframes burstS { 40% { transform: scale(1.06); } 75% { transform: scale(.99); } }
@keyframes tickIn { from { stroke-dashoffset: 56; } }
.ring1.burst { animation: burst .55s .55s cubic-bezier(.3, .7, .3, 1.2); }
.rings.burst { animation: burstS .6s .6s cubic-bezier(.3, .7, .3, 1.2); }
.ring1.full.burst .tick { animation: tickIn .35s .7s ease-out backwards; }
main.anim .ring1.full .tick { animation: tickIn .35s 1.05s ease-out backwards; }

/* troca de aba: tudo entra suave, um bloco depois do outro */
@keyframes fadein { from { opacity: 0; transform: translateY(12px); } }
main.anim > * { animation: fadein .5s cubic-bezier(.2, .8, .2, 1) both; }
main.anim > :nth-child(2) { animation-delay: .05s; } main.anim > :nth-child(3) { animation-delay: .1s; }
main.anim > :nth-child(4) { animation-delay: .15s; } main.anim > :nth-child(5) { animation-delay: .2s; }
main.anim > :nth-child(6) { animation-delay: .25s; } main.anim > :nth-child(n+7) { animation-delay: .3s; }
/* troca de dia: desliza pro lado certo */
@keyframes slideL { from { opacity: 0; transform: translateX(28px); } }
@keyframes slideR { from { opacity: 0; transform: translateX(-28px); } }
main.slide-l > :not(.chips) { animation: slideL .42s cubic-bezier(.2, .8, .2, 1) both; }
main.slide-r > :not(.chips) { animation: slideR .42s cubic-bezier(.2, .8, .2, 1) both; }
main.slide-l > :nth-child(3), main.slide-r > :nth-child(3) { animation-delay: .04s; }
main.slide-l > :nth-child(n+4), main.slide-r > :nth-child(n+4) { animation-delay: .08s; }
/* gráficos crescem ao abrir */
@keyframes growY { from { transform: scaleY(0); } }
@keyframes draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
@keyframes donutIn { from { stroke-dasharray: 0 999; } }
main.anim .chart rect { transform-box: fill-box; transform-origin: bottom; animation: growY .8s .15s cubic-bezier(.2, .8, .2, 1) both; }
main.anim .chart polyline { stroke-dasharray: 1000; animation: draw 1.4s .2s ease-out both; }
main.anim .donut .arc { animation: donutIn 1s .15s cubic-bezier(.2, .8, .2, 1) both; }
/* folha e fundo */
@keyframes sheetOut { to { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
@keyframes fadeOut { to { opacity: 0; } }
dialog[open]::backdrop { animation: fade .3s ease; }
dialog.closing { animation: sheetOut .23s cubic-bezier(.5, 0, .9, .6) forwards; }
dialog.closing::backdrop { animation: fadeOut .23s ease forwards; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .45s; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.confetti i { position: absolute; width: 8px; height: 12px; border-radius: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after, ::backdrop { animation: none !important; transition: none !important; } }
@media (min-width: 700px) { .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; } .grid2 > .card { margin: 0 0 16px; } }
</style>
</head>
<body>
<div class="navbar blur" aria-hidden="true"><span id="navTitle"></span></div>

    <div class="eyebrow" id="weekRange"></div>
    <h1 id="pageTitle">Painel Semanal</h1>
  </div>
  <button class="icon-btn" id="themeBtn" type="button" aria-label="Alternar tema"></button>

<nav class="tabs blur" aria-label="Navegação principal">
  <button type="button" data-tab="dia"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>Hoje</button>

  <button type="button" data-tab="graficos"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><rect x="3" y="12" width="4.2" height="9" rx="1.6"/><rect x="9.9" y="7" width="4.2" height="14" rx="1.6"/><rect x="16.8" y="3" width="4.2" height="18" rx="1.6"/></svg>Gráficos</button>

  <button type="button" data-tab="editar"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6.5h9M18 6.5h2M4 12h3M12 12h8M4 17.5h11"/><circle cx="15.5" cy="6.5" r="2.4"/><circle cx="9.5" cy="12" r="2.4"/><circle cx="17.5" cy="17.5" r="2.4"/></svg>Editar</button>

<div id="toast" role="status" aria-live="polite"></div>

<dialog id="newWeekDlg" aria-labelledby="nwTitle"><form method="dialog" class="dlg" id="newWeekForm"></form></dialog>

<script>
'use strict';
/* ============================ Utilitários ============================ */
const STORAGE_KEY = 'painelSemanal.v1';
const SCHEMA = 1;
const AREAS = [
  { id: 'trabalho', label: 'Trabalho', icon: '💼', color: 'var(--c-trabalho)' },
  { id: 'saude',    label: 'Saúde',    icon: '💪', color: 'var(--c-saude)' },
  { id: 'estudos',  label: 'Estudos',  icon: '📚', color: 'var(--c-estudos)' },
  { id: 'habitos',  label: 'Hábitos',  icon: '✅', color: 'var(--c-habitos)' }
];
const AREA = Object.fromEntries(AREAS.map(a => [a.id, a]));
const WD_SHORT = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
const WD_LONG = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo'];
const WHEN_LABEL = { all: 'Todos os dias', training: 'Dias de treino', study: 'Dias de estudo' };

const pad = n => String(n).padStart(2, '0');
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return fmtISO(d); };
const weekdayIdx = s => (parseDate(s).getDay() + 6) % 7;
const mondayOf = s => addDays(s, -weekdayIdx(s));
const fmtBR = s => { const d = parseDate(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const isISODate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
function todayISO() {
  const q = new URLSearchParams(location.search).get('data'); // ?data=AAAA-MM-DD (testes)
  return isISODate(q) ? q : fmtISO(new Date());
}
const clone = o => JSON.parse(JSON.stringify(o));
const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp01 = x => Math.max(0, Math.min(1, Number(x) || 0));
const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
const pctTxt = p => p == null ? '—' : Math.round(p * 100) + '%';
const num = n => Number(n || 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 });

/* ============================== Estado ============================== */
let state = null;
const ui = { tab: 'dia', day: null, editing: {}, open: new Set(['ed-metas']), pop: null, swWaiting: null };

function buildWeek(start) {
  const days = {};
  for (let i = 0; i < 7; i++) {
    const d = addDays(start, i);
    days[d] = {
      onTime: false, fixedDone: {}, habits: {}, study: {},
      demands: clone(CONFIG.demands?.[d] || []).map(x => ({ ...x, done: false })),
      events: clone(CONFIG.events?.[d] || []),
      fixedOverride: CONFIG.fixedOverrides?.[d] ? clone(CONFIG.fixedOverrides[d]) : null
    };
  }
  return { start, goalsDone: {}, days };
}

function freshState() {
  let start = CONFIG.weekStart;
  const t = todayISO();
  if (t > addDays(start, 6)) start = mondayOf(t);
  return {
    schema: SCHEMA, configVersion: CONFIG.configVersion, base: clone(CONFIG),
    settings: { ...clone(CONFIG.settings), theme: 'auto' },
    habits: clone(CONFIG.habits), goals: clone(CONFIG.goals), fixed: clone(CONFIG.fixed),
    week: buildWeek(start), history: [], seenChangelog: CONFIG.configVersion
  };
}

/* Mescla listas por id: aplica o que o CONFIG mudou, preserva o que o usuário
   adicionou/editou/removeu no painel e as marcações (done). */
function mergeList(cur, base, next) {
  cur = cur || []; base = base || []; next = next || [];
  const bMap = new Map(base.map(i => [i.id, i])), nMap = new Map(next.map(i => [i.id, i]));
  const out = [];
  for (const item of cur) {
    if (nMap.has(item.id)) {
      const n = nMap.get(item.id), b = bMap.get(item.id);
      out.push(!b || !same(n, b) ? { ...item, ...clone(n) } : item);
    } else if (!bMap.has(item.id)) out.push(item); // item do usuário
  }
  const have = new Set(out.map(i => i.id));
  next.forEach((n, idx) => {
    if (have.has(n.id)) return;
    const b = bMap.get(n.id);
    if (b && same(n, b)) return; // removido pelo usuário e não mudou no CONFIG
    let pos = 0;
    for (let k = idx - 1; k >= 0; k--) {
      const j = out.findIndex(o => o.id === next[k].id);
      if (j >= 0) { pos = j + 1; break; }
    }
    out.splice(pos, 0, clone(n)); have.add(n.id);
  });

}

function applyConfigUpdate() {
  const s = state, base = s.base || {};
  for (const k of Object.keys(CONFIG.settings)) {
    if (!same(CONFIG.settings[k], base.settings?.[k]) || s.settings[k] === undefined) s.settings[k] = clone(CONFIG.settings[k]);
  }
  s.habits = mergeList(s.habits, base.habits, CONFIG.habits);
  s.goals = mergeList(s.goals, base.goals, CONFIG.goals);
  for (let wd = 0; wd < 7; wd++) s.fixed[wd] = mergeList(s.fixed[wd], base.fixed?.[wd], CONFIG.fixed[wd]);

  if (CONFIG.weekStart > s.week.start) {
    s.history.push(snapshotWeek());
    s.goals = s.goals.filter(g => !g.once);
    s.week = buildWeek(CONFIG.weekStart);
  }
  for (const d of weekDates()) {
    const day = s.week.days[d];
    day.demands = mergeList(day.demands, base.demands?.[d], CONFIG.demands?.[d]).map(x => ({ done: false, ...x }));
    day.events = mergeList(day.events, base.events?.[d], CONFIG.events?.[d]);
    const ov = CONFIG.fixedOverrides?.[d], bov = base.fixedOverrides?.[d];
    if (!same(ov, bov)) day.fixedOverride = ov ? clone(ov) : null;
  }
  s.base = clone(CONFIG);
  s.configVersion = CONFIG.configVersion;
}

function isValidState(s) {
  return s && s.schema === SCHEMA && s.week && isISODate(s.week.start) && s.week.days &&
    Array.isArray(s.habits) && Array.isArray(s.goals) && Array.isArray(s.fixed) && Array.isArray(s.history) && s.settings;
}

function hydrate(obj) {
  state = isValidState(obj) ? obj : freshState();
  // garante a integridade dos dias da semana
  for (const d of weekDates()) {
    const day = state.week.days[d] || (state.week.days[d] = buildWeek(state.week.start).days[d]);
    day.fixedDone ||= {}; day.habits ||= {}; day.study ||= {}; day.demands ||= []; day.events ||= [];
    if (day.fixedOverride === undefined) day.fixedOverride = null;
  }
  state.week.goalsDone ||= {};
  while (state.fixed.length < 7) state.fixed.push([]);
  if (state.configVersion !== CONFIG.configVersion) applyConfigUpdate();
}

function load() {
  let obj = null;
  try { obj = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { obj = null; }
  hydrate(obj);
  save();
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { toast('Não foi possível salvar (armazenamento cheio?). Exporte um backup.'); }
}

/* ============================== Cálculos ============================== */
const weekDates = (start = state.week.start) => Array.from({ length: 7 }, (_, i) => addDays(start, i));
const weekEnd = () => addDays(state.week.start, 6);
const isWork = wd => state.settings.workDays.includes(wd);
const isRest = wd => state.settings.restDays.includes(wd);
const isStudy = wd => state.settings.studyDays.includes(wd);
const studyGoal = () => state.settings.studySplit.reduce((a, s) => a + (Number(s.hours) || 0), 0);
const bottlesGoal = () => Math.max(1, Math.round(Number(state.settings.waterGoalLiters) / Number(state.settings.bottleLiters || 1)));
const fixedFor = d => state.week.days[d].fixedOverride || state.fixed[weekdayIdx(d)] || [];
const studyTotal = day => state.settings.studySplit.reduce((a, s) => a + (Number(day.study[s.id]) || 0), 0);

function habitApplies(h, wd) {
  if (!h.enabled) return false;
  if (h.when === 'training') return !isRest(wd);
  if (h.when === 'study') return isStudy(wd);
  return true;
}
function habitScore(h, day) {
  if (h.type === 'water') return clamp01((day.habits[h.id] || 0) / bottlesGoal());
  if (h.type === 'study') return studyGoal() ? clamp01(studyTotal(day) / studyGoal()) : 1;
  return day.habits[h.id] ? 1 : 0;
}

function dayAreas(d) {
  const wd = weekdayIdx(d), day = state.week.days[d];
  const r = { trabalho: [], saude: [], estudos: [], habitos: [] };
  if (isWork(wd)) r.trabalho.push(day.onTime ? 1 : 0);
  day.demands.forEach(x => r.trabalho.push(x.done ? 1 : 0));
  if (!isRest(wd)) fixedFor(d).forEach(f => r.saude.push(day.fixedDone[f.id] ? 1 : 0));
  if (isStudy(wd)) state.settings.studySplit.forEach(s => { if (Number(s.hours) > 0) r.estudos.push(clamp01((Number(day.study[s.id]) || 0) / s.hours)); });
  state.habits.forEach(h => { if (habitApplies(h, wd)) r.habitos.push(habitScore(h, day)); });
  const out = {};
  for (const k in r) out[k] = { pct: avg(r[k]), done: r[k].filter(x => x >= 1).length, total: r[k].length };
  return out;
}
const dayPct = areas => avg(Object.values(areas).map(a => a.pct).filter(p => p != null));

function goalMetric(g) {
  if (!g.metric) return null;
  const dates = weekDates(), W = state.week.days;
  if (g.metric === 'onTime') {
    const ds = dates.filter(d => isWork(weekdayIdx(d)));
    return { v: ds.filter(d => W[d].onTime).length, t: ds.length, unit: 'dias' };
  }
  if (g.metric === 'demands') {
    let v = 0, t = 0;
    dates.forEach(d => W[d].demands.forEach(x => { t++; if (x.done) v++; }));
    return { v, t, unit: 'demandas', reached: t > 0 && v === t };
  }
  if (g.metric === 'training') {
    const ds = dates.filter(d => !isRest(weekdayIdx(d)) && fixedFor(d).length);
    return { v: ds.filter(d => fixedFor(d).every(f => W[d].fixedDone[f.id])).length, t: ds.length, unit: 'dias' };
  }
  if (g.metric.startsWith('study:')) {
    const id = g.metric.slice(6), s = state.settings.studySplit.find(x => x.id === id);
    if (!s) return null;
    const t = Number(s.hours) * dates.filter(d => isStudy(weekdayIdx(d))).length;
    return { v: dates.reduce((a, d) => a + (Number(W[d].study[id]) || 0), 0), t, unit: 'h' };
  }
  return null;
}
function goalStatus() {
  return state.goals.map(g => {
    const m = goalMetric(g);
    const reached = m ? (m.reached ?? (m.t > 0 && m.v >= m.t)) : false;
    const manual = state.week.goalsDone[g.id];
    return { ...g, m, done: manual ?? reached };
  });
}

function weekStats() {
  const per = weekDates().map(d => { const areas = dayAreas(d); return { date: d, areas, pct: dayPct(areas) }; });
  const areas = {};
  AREAS.forEach(a => { areas[a.id] = avg(per.map(p => p.areas[a.id].pct).filter(x => x != null)); });
  const overall = avg(Object.values(areas).filter(x => x != null));
  const goals = goalStatus();
  const goalsPct = goals.length ? goals.filter(g => g.done).length / goals.length : null;
  return { per, areas, overall, goals, goalsPct };
}

function liveHabitMap() {
  const map = {};
  weekDates().forEach(d => {
    const wd = weekdayIdx(d), day = state.week.days[d], rec = {};
    state.habits.forEach(h => { if (h.enabled) rec[h.id] = habitApplies(h, wd) ? habitScore(h, day) >= 1 : null; });
    map[d] = rec;
  });
  return map;
}
function streakMap() {
  const map = {};
  state.history.forEach(w => (w.days || []).forEach(d => { map[d.date] = d.habitDone || {}; }));
  return Object.assign(map, liveHabitMap());
}
// Dias consecutivos concluídos até hoje (hoje ainda em aberto não quebra; dias não aplicáveis são pulados)
function streak(hid, map) {
  const t = todayISO(); let c = 0;
  for (let i = 0; i < 1000; i++) {
    const rec = map[addDays(t, -i)];
    if (!rec) { if (i === 0) continue; break; }
    const v = rec[hid];
    if (v === null) continue;
    if (v === undefined) break;
    if (v) c++; else if (i === 0) continue; else break;
  }
  return c;
}

/* Sequência geral: dias seguidos com pelo menos streakMinPct do dia feito.
   Hoje em aberto não quebra; dias sem nada aplicável são pulados. */
const streakMin = () => state.settings.streakMinPct ?? 0.8;
function dayPctMap() {
  const map = {};
  state.history.forEach(w => (w.days || []).forEach(d => { map[d.date] = d.pct ?? null; }));
  weekDates().forEach(d => { map[d] = dayPct(dayAreas(d)); });
  return map;
}
function dayStreak(map = dayPctMap()) {
  const t = todayISO(), min = streakMin() - 1e-9;
  let count = 0, through = null;
  for (let i = 0; i < 3700; i++) {
    const d = addDays(t, -i);
    if (!(d in map)) { if (i === 0) continue; break; }
    const p = map[d];
    if (p == null) continue;
    if (p >= min) { count++; through ||= d; } else if (i === 0) continue; else break;
  }
  // dias "livres" logo depois do último dia contado não deixam a sequência expirar
  while (through && through < addDays(t, -1) && map[addDays(through, 1)] === null) through = addDays(through, 1);
  return { count, through };
}
function bestStreak(map, t = todayISO()) {
  let best = 0, run = 0, prev = null;
  const min = streakMin() - 1e-9;
  Object.keys(map).sort().forEach(d => {
    if (d > t) return;
    if (prev && addDays(prev, 1) !== d) run = 0;
    prev = d;
    const p = map[d];
    if (p == null) return;
    if (p >= min) best = Math.max(best, ++run); else if (d !== t) run = 0;
  });

}

function snapshotWeek() {
  const st = weekStats(), map = liveHabitMap();
  return {
    start: state.week.start, end: weekEnd(), archivedAt: new Date().toISOString(),
    summary: {
      overall: st.overall, areas: st.areas, days: st.per.map(p => p.pct),
      goals: { done: st.goals.filter(g => g.done).length, total: st.goals.length }
    },
    goals: st.goals.map(g => ({ area: g.area, text: g.text, done: !!g.done, metric: g.m ? `${num(g.m.v)}/${num(g.m.t)} ${g.m.unit}` : null })),
    habits: state.habits.filter(h => h.enabled).map(h => ({ id: h.id, label: h.label, icon: h.icon })),
    days: weekDates().map((d, i) => {
      const day = state.week.days[d];
      return {
        date: d, pct: st.per[i].pct, onTime: day.onTime, demands: clone(day.demands), events: clone(day.events),
        fixed: fixedFor(d).map(f => ({ text: f.text, done: !!day.fixedDone[f.id] })),

function startNewWeek(carry) {
  state.history.push(snapshotWeek());
  const next = addDays(state.week.start, 7), tm = mondayOf(todayISO());
  const start = tm > next ? tm : next;
  state.goals = state.goals.filter(g => !g.once);
  carry.goals.forEach(g => state.goals.push({ id: uid(), area: g.area, text: g.text, once: true, carried: true }));
  state.week = buildWeek(start);
  const mon = state.week.days[start];
  carry.demands.forEach(x => mon.demands.push({ id: uid(), text: x.text, done: false, carried: true }));
  ui.day = defaultDay();

function defaultDay() {
  const t = todayISO();
  if (state.week.days[t]) return t;
  return t > weekEnd() ? weekEnd() : state.week.start;
}
/* ============================ Componentes ============================ */
function bar(p, color = 'var(--primary)', label = '', cls = '', key = '') {

  return `<span class="bar ${cls}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}" aria-label="${esc(label)}"><span${rk} style="width:${v}%;background:${color}"></span></span>`;
}
function progRow(label, p, color) {
  return `<div class="prog"><span>${esc(label)}</span>${bar(p, color, label)}<span class="v">${pctTxt(p)}</span></div>`;
}
function donut(p, color, label) {
  const r = 38, c = 2 * Math.PI * r, v = p == null ? 0 : clamp01(p);
  return `<figure class="donut"><svg viewBox="0 0 100 100" role="img" aria-label="${esc(label)}: ${pctTxt(p)}">

// Bolinha de marcar: o anel .p "se completa" e depois o ✓ é desenhado (ver .pop no CSS).
const BOX = `<span class="box" aria-hidden="true"><svg viewBox="0 0 28 28"><circle class="o" cx="14" cy="14" r="12"/><circle class="p" cx="14" cy="14" r="12" transform="rotate(-90 14 14)"/><path class="m" d="M8.6 14.4l3.6 3.6 7.2-7.6"/></svg></span>`;
function checkBtn({ fk, act, data = '', label, sub = '', done, extra = '' }) {

const streakBadge = n => n > 1 ? `<span class="streak" aria-label="Sequência de ${n} dias">🔥${n}</span>` : '';

// Arco de progresso. Com `key`, o render() anima do valor anterior até o novo (rodinha completando).

    fx.forEach(f => {
      h += checkBtn({ fk: `fx-${d}-${f.id}`, act: 'toggle-fixed', data: `data-date="${d}" data-id="${esc(f.id)}"`, label: `${f.icon ? f.icon + ' ' : ''}${esc(f.text)}`, done: !!day.fixedDone[f.id], sub: day.fixedOverride && f === fx[0] ? 'Treino diferente do padrão' : '' });
    });
  }
  return h + '</div></section>';
}

function counterRow({ fk, act, data, label, value, goal, unit, done, step, p, color, key, extra = '' }) {
  return `<div class="counter-row ${done ? 'done' : ''}" data-fk="${fk}-row">
    <span class="box" aria-hidden="true">${ring1(p, color, key, { sw: 14, tick: true })}</span>
    <div class="lbl">${label}<small>${num(value)} / ${num(goal)} ${unit}</small>${extra}</div>
    <div class="counter">
      <button type="button" data-act="${act}" ${data} data-delta="-${step}" data-fk="${fk}-minus" aria-label="Diminuir ${esc(stripTags(label))}">−</button>
      <output class="sr-only" aria-live="polite">${num(value)}</output>
      <button type="button" data-act="${act}" ${data} data-delta="${step}" data-fk="${fk}-plus" aria-label="Aumentar ${esc(stripTags(label))}">+</button>
    </div></div>`;
}
const stripTags = s => String(s).replace(/<[^>]*>/g, '');

function cardStudy(d, wd, day) {
  const free = !isStudy(wd);
  let h = `<section class="card area-estudos">${areaH(d, 'estudos', 'Estudos', `<span class="cnt">${free ? 'dia livre' : `${num(studyTotal(day))} / ${num(studyGoal())} h`}</span>`)}<div class="stack">`;
  const step = Number(state.settings.studyStep) || 0.5;
  state.settings.studySplit.forEach(s => {
    const v = Number(day.study[s.id]) || 0, g = Number(s.hours) || 0;
    h += counterRow({
      fk: `st-${d}-${s.id}`, act: 'study', data: `data-date="${d}" data-id="${esc(s.id)}"`, label: esc(s.label), value: v, goal: s.hours, unit: 'h',
      done: !free && v >= g, step, p: free ? (v > 0 ? 1 : null) : g ? v / g : null, color: 'var(--c-estudos)', key: `d-st-${s.id}`
    });
  });
  return h + '</div></section>';
}

function cardHabits(d, wd, day, sMap) {
  let h = `<section class="card area-habitos">${areaH(d, 'habitos', 'Hábitos')}<div class="stack">`;
  const enabled = state.habits.filter(x => x.enabled), na = [];
  if (!enabled.length) h += `<p class="muted small">Nenhum hábito ativo. Ative em Editar → Hábitos.</p>`;
  enabled.forEach(hb => {
    const applies = habitApplies(hb, wd), st = streakBadge(streak(hb.id, sMap));
    const label = `${hb.icon ? hb.icon + ' ' : ''}${esc(hb.label)}`;
    if (!applies) { na.push(esc(hb.label)); return; }
    if (hb.type === 'water') {
      const v = day.habits[hb.id] || 0, goal = bottlesGoal(), L = Number(state.settings.bottleLiters) || 1;
      h += counterRow({
        fk: `w-${d}`, act: 'water', data: `data-date="${d}" data-id="${esc(hb.id)}"`, label: `${label} ${st}`,
        value: v * L, goal: goal * L, unit: L === 1 ? 'L' : `L · ${v}/${goal} de ${num(L)} L`, done: v >= goal, step: 1,
        p: goal ? v / goal : null, color: 'var(--water)', key: 'd-water'
      });
    } else if (hb.type === 'study') {
      return; // aparece no card Estudos (o hábito fecha sozinho ao bater as horas)
    } else {
      const sub = hb.type === 'wake' ? `até ${esc(state.settings.wakeTarget)}` : '';
      h += checkBtn({ fk: `hb-${d}-${hb.id}`, act: 'toggle-habit', data: `data-date="${d}" data-id="${esc(hb.id)}"`, label, sub, done: !!day.habits[hb.id], extra: st });
    }
  });
  if (na.length) h += `<p class="muted small na-line">Não se aplica hoje: ${na.join(', ')}</p>`;
  return h + '</div></section>';
}

/* ============================== Gráficos (SVG) ============================== */
function svgBars(items) {
  const W = 320, H = 180, pl = 30, pr = 6, pt = 18, pb = 36, ch = H - pt - pb, n = items.length;
  const cw = (W - pl - pr) / n, bw = Math.min(28, cw * .62);
  let g = '';
  [0, .5, 1].forEach(v => {
    const y = pt + ch * (1 - v);
    g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" class="grid"/><text x="${pl - 4}" y="${y + 3}" class="axis" text-anchor="end">${v * 100}%</text>`;
  });
  items.forEach((it, i) => {
    const x = pl + cw * i + cw / 2;
    if (it.value != null) {
      const bh = Math.max(clamp01(it.value) * ch, it.value > 0 ? 2 : 0);
      g += `<rect x="${(x - bw / 2).toFixed(1)}" y="${(pt + ch - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" style="fill:${it.color || 'var(--primary)'}"/>`;
      g += `<text x="${x.toFixed(1)}" y="${(pt + ch - bh - 4).toFixed(1)}" class="val" text-anchor="middle">${Math.round(it.value * 100)}</text>`;
    } else g += `<text x="${x.toFixed(1)}" y="${pt + ch - 4}" class="val" text-anchor="middle">—</text>`;
    g += `<text x="${x.toFixed(1)}" y="${H - pb + 15}" class="axis ${it.hl ? 'axis-hl' : ''}" text-anchor="middle">${esc(it.label)}</text>`;
    if (it.sub) g += `<text x="${x.toFixed(1)}" y="${H - pb + 28}" class="axis" text-anchor="middle">${esc(it.sub)}</text>`;
  });
  const desc = items.map(it => `${it.label}${it.sub ? ' ' + it.sub : ''}: ${pctTxt(it.value)}`).join(', ');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(desc)}">${g}</svg>`;
}

function svgLines(labels, series) {
  const W = 320, H = 190, pl = 30, pr = 14, pt = 14, pb = 30, ch = H - pt - pb, n = labels.length;
  const X = i => n === 1 ? pl + (W - pl - pr) / 2 : pl + (W - pl - pr) * i / (n - 1);
  const Y = v => pt + ch * (1 - clamp01(v));
  let g = '';
  [0, .5, 1].forEach(v => { const y = Y(v); g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" class="grid"/><text x="${pl - 4}" y="${y + 3}" class="axis" text-anchor="end">${v * 100}%</text>`; });
  const every = Math.ceil(n / 7);
  labels.forEach((l, i) => { if (i % every === 0 || i === n - 1) g += `<text x="${X(i).toFixed(1)}" y="${H - 10}" class="axis" text-anchor="middle">${esc(l)}</text>`; });
  series.forEach(s => {
    const pts = s.values.map((v, i) => v == null ? null : [X(i), Y(v)]).filter(Boolean);
    if (pts.length > 1) g += `<polyline points="${pts.map(p => p.map(x => x.toFixed(1)).join(',')).join(' ')}" style="fill:none;stroke:${s.color};stroke-width:${s.w};stroke-linejoin:round;stroke-linecap:round;opacity:${s.o || 1}"/>`;
    pts.forEach(p => { g += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${s.w + 1}" style="fill:${s.color};opacity:${s.o || 1}"/>`; });
  });
  const main = series[0];
  const desc = 'Evolução semanal: ' + labels.map((l, i) => `${l} ${pctTxt(main.values[i])}`).join(', ');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(desc)}">${g}</svg>`;
}

function renderCharts() {
  const st = weekStats(), t = todayISO();
  let h = `<section class="card">${cardH('📅', 'Conclusão por dia')}${svgBars(st.per.map(p => ({
    label: WD_SHORT[weekdayIdx(p.date)], sub: fmtBR(p.date), value: p.pct, hl: p.date === t,
    color: p.date === t ? 'var(--primary)' : 'color-mix(in srgb, var(--primary) 55%, var(--track))'
  })))}</section>`;

  h += `<section class="card">${cardH('🧭', 'Por área (semana)')}<div class="donut-grid">${AREAS.map(a => donut(st.areas[a.id], a.color, a.label)).join('')}</div>
    ${svgBars(AREAS.map(a => ({ label: a.label, value: st.areas[a.id], color: a.color })))}</section>`;

  const weeks = state.history.slice(-11);
  const labels = [...weeks.map(w => fmtBR(w.start)), 'Atual'];
  const series = [{ name: 'Geral', color: 'var(--primary)', w: 3, values: [...weeks.map(w => w.summary.overall), st.overall] },
    ...AREAS.map(a => ({ name: a.label, color: a.color, w: 1.5, o: .75, values: [...weeks.map(w => w.summary.areas?.[a.id] ?? null), st.areas[a.id]] }))];
  h += `<section class="card">${cardH('📈', 'Evolução semanal')}${weeks.length ? '' : '<p class="muted small">A linha aparece a partir da 2ª semana. Use “Nova semana” no domingo à noite ou na segunda.</p>'}
    ${svgLines(labels, series)}<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div></section>`;

  const sMap = streakMap(), live = liveHabitMap();
  const dates = weekDates();
  h += `<section class="card">${cardH('🔥', 'Hábitos e sequências')}<div style="overflow-x:auto"><table class="heat">
    <thead><tr><th scope="col" class="sr-only">Hábito</th>${dates.map(d => `<th scope="col">${WD_SHORT[weekdayIdx(d)][0]}</th>`).join('')}<th scope="col">🔥</th></tr></thead><tbody>`;
  state.habits.filter(x => x.enabled).forEach(hb => {
    h += `<tr><th scope="row" class="h" title="${esc(hb.label)}">${hb.icon || ''} ${esc(hb.label)}</th>`;
    dates.forEach(d => {
      const v = live[d][hb.id], score = v === null ? null : habitScore(hb, state.week.days[d]);
      let cls = 'c-miss', txt = '', lab = 'não feito';
      if (v === null) { cls = 'c-na'; txt = '·'; lab = 'não se aplica'; }
      else if (v) { cls = 'c-done'; txt = '✓'; lab = 'feito'; }
      else if (d > t) { cls = 'c-future'; lab = 'futuro'; }
      else if (score > 0) { cls = 'c-part'; lab = 'parcial'; }
      h += `<td class="${cls}" aria-label="${WD_LONG[weekdayIdx(d)]}: ${lab}">${txt}</td>`;
    });
    h += `<td class="st">${streak(hb.id, sMap)}</td></tr>`;
  });
  h += `</tbody></table></div><p class="muted small">🔥 = dias seguidos. Dias que não se aplicam (ex.: treino no domingo) não quebram a sequência.</p></section>`;
  return h;
}

/* ============================== Histórico ============================== */
function renderHistory() {
  const st = weekStats(), hist = state.history;
  if (!hist.length) return `<section class="card">${cardH('🕘', 'Histórico')}<p class="muted">Ainda não há semanas arquivadas. Ao tocar em <b>Nova semana</b>, a semana atual vem para cá.</p></section>`;
  const prev = hist[hist.length - 1].summary;
  const mean = k => avg(hist.map(w => k === 'overall' ? w.summary.overall : k === 'goals' ? (w.summary.goals?.total ? w.summary.goals.done / w.summary.goals.total : null) : w.summary.areas?.[k]).filter(x => x != null));
  const rows = [['Geral', 'overall', st.overall, prev.overall], ...AREAS.map(a => [a.label, a.id, st.areas[a.id], prev.areas?.[a.id]]),
    ['Metas', 'goals', st.goalsPct, prev.goals?.total ? prev.goals.done / prev.goals.total : null]];
  const delta = (a, b) => {
    if (a == null || b == null) return '—';
    const dlt = Math.round((a - b) * 100);
    return dlt > 0 ? `<span class="up">▲ ${dlt}</span>` : dlt < 0 ? `<span class="down">▼ ${-dlt}</span>` : '=';
  };
  let h = `<section class="card">${cardH('⚖️', 'Comparação')}<table class="cmp"><thead><tr><th scope="col">Área</th><th scope="col">Atual</th><th scope="col">Anterior</th><th scope="col">Média</th><th scope="col">Δ</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${r[0]}</td><td><b>${pctTxt(r[2])}</b></td><td>${pctTxt(r[3])}</td><td>${pctTxt(mean(r[1]))}</td><td>${delta(r[2], r[3])}</td></tr>`).join('')}
    </tbody></table><p class="muted small">Δ = diferença em pontos percentuais entre a semana atual e a anterior.</p></section>`;

  const best = hist.reduce((b, w) => (w.summary.overall ?? -1) > (b.summary.overall ?? -1) ? w : b, hist[0]);
  h += `<p class="muted small">🏆 Melhor semana: ${fmtBR(best.start)}–${fmtBR(best.end)} (${pctTxt(best.summary.overall)}) · ${hist.length} semana${hist.length > 1 ? 's' : ''} arquivada${hist.length > 1 ? 's' : ''}</p>`;
  hist.slice().reverse().forEach((w, ri) => {
    const idx = hist.length - 1 - ri, s = w.summary;
    h += `<details class="sec"><summary>${fmtBR(w.start)} – ${fmtBR(w.end)}<span class="muted" style="margin-left:auto">${pctTxt(s.overall)}</span></summary><div class="inner">
      ${AREAS.map(a => progRow(a.label, s.areas?.[a.id], a.color)).join('')}
      ${svgBars((w.days || []).map(d => ({ label: WD_SHORT[weekdayIdx(d.date)], sub: fmtBR(d.date), value: d.pct })))}
      <div class="sub-h">Metas (${s.goals?.done ?? 0}/${s.goals?.total ?? 0})</div>
      <ul class="small">${(w.goals || []).map(g => `<li>${g.done ? '✅' : '⬜'} ${esc(g.text)}${g.metric ? ` <span class="muted">(${esc(g.metric)})</span>` : ''}</li>`).join('')}</ul>
      <div class="sub-h">Hábitos (dias cumpridos)</div>
      <ul class="small">${(w.habits || []).map(hb => {
        const vals = (w.days || []).map(d => d.habitDone?.[hb.id]).filter(v => v !== null && v !== undefined);
        return `<li>${hb.icon || ''} ${esc(hb.label)}: ${vals.filter(Boolean).length}/${vals.length}</li>`;
      }).join('')}</ul>
      <button type="button" class="btn sm danger" data-act="del-history" data-idx="${idx}">Remover do histórico</button>
    </div></details>`;
  });
  return h;
}

/* ============================== Editor ============================== */
function getList(key, create) {
  const [kind, arg] = key.split(/:(.*)/s);
  if (kind === 'goals') return state.goals;
  if (kind === 'habits') return state.habits;
  if (kind === 'fixed') return state.fixed[Number(arg)];
  const day = state.week.days[arg];
  if (!day) return null;
  if (kind === 'demands') return day.demands;
  if (kind === 'events') return day.events;
  if (kind === 'override') {
    if (!day.fixedOverride && create) day.fixedOverride = clone(state.fixed[weekdayIdx(arg)] || []);
    return day.fixedOverride || state.fixed[weekdayIdx(arg)];
  }
  return null;
}

function listEditor(key, items, opts = {}) {
  const k = esc(key);

      <button type="button" class="ed-btn" data-act="move" data-key="${k}" data-id="${esc(it.id)}" data-dir="1" aria-label="Mover para baixo: ${esc(label)}" ${i === items.length - 1 ? 'disabled' : ''}>↓</button>
      ${opts.icons ? `<input type="text" class="ico-in" data-edit-icon="${k}" data-id="${esc(it.id)}" value="${esc(it.icon || '')}" aria-label="Ícone de ${esc(label)}" maxlength="4">` : ''}
      <input type="text" data-edit="${k}" data-id="${esc(it.id)}" value="${esc(label)}" aria-label="Editar: ${esc(label)}">
      ${opts.area ? `<select data-edit-area="${k}" data-id="${esc(it.id)}" aria-label="Área de ${esc(label)}">${AREAS.map(a => `<option value="${a.id}" ${a.id === it.area ? 'selected' : ''}>${a.icon}</option>`).join('')}</select>` : ''}
      ${opts.toggle ? `<button type="button" class="switch" data-act="toggle-enabled" data-id="${esc(it.id)}" aria-pressed="${!!it.enabled}" aria-label="${esc(label)} ativo"><span class="sr-only">${it.enabled ? 'Ativo' : 'Off'}</span></button>` : ''}
      <button type="button" class="ed-btn del push" data-act="remove" data-key="${k}" data-id="${esc(it.id)}" aria-label="Remover: ${esc(label)}">🗑</button>
    </div>`;
  });
  const fid = 'add-' + key.replace(/[^a-z0-9]/gi, '-');
  h += `<form class="add-form" data-add="${k}"><label class="sr-only" for="${fid}">Adicionar item</label>

    ${opts.area ? `<select name="area" aria-label="Área">${AREAS.map(a => `<option value="${a.id}">${a.icon} ${a.label}</option>`).join('')}</select>` : ''}
    ${opts.when ? `<select name="when" aria-label="Quando">${Object.entries(WHEN_LABEL).map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>` : ''}
    <button class="btn" type="submit">Adicionar</button></form>`;
  return h;
}

// Vibração curta. No iPhone (sem navigator.vibrate) usa o truque do <input switch> do iOS 18+.
function haptic(strong) {
  try {
    if (navigator.vibrate) { navigator.vibrate(strong ? [14, 70, 24] : 12); return; }
    if (!/iP(hone|ad|od)/.test(navigator.userAgent)) return;
    const tap = () => {
      const l = document.createElement('label'), i = document.createElement('input');
      i.type = 'checkbox'; i.setAttribute('switch', ''); l.setAttribute('aria-hidden', 'true'); l.style.display = 'none';
      l.appendChild(i); document.head.appendChild(l); l.click(); l.remove();
    };
    tap(); if (strong) setTimeout(tap, 110);
  } catch (e) { /* sem vibração */ }
}

/* ---------- animações: anéis, barras e números saem do valor antigo até o novo ---------- */
const RM = matchMedia('(prefers-reduced-motion: reduce)');
const EASE = 'cubic-bezier(.22,.9,.24,1)';
function snapshot() {
  const m = new Map();
  app.querySelectorAll('[data-rk]').forEach(el => m.set(el.dataset.rk, Number(el.dataset.v)));
  return m;
}
function countUp(el, from, to, dur, delay) {
  const t0 = performance.now() + delay, fmt = x => Math.round(x * 100) + '%';
  el.textContent = fmt(from);
  const step = now => {
    if (!el.isConnected) return;
    const k = Math.min(1, Math.max(0, (now - t0) / dur)), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function morph(prev, fresh) {
  if (RM.matches) return;
  const done = [];
  let i = 0;
  app.querySelectorAll('[data-rk]').forEach(el => {
    const k = el.dataset.rk, to = Number(el.dataset.v), t = el.dataset.t || 'ring';
    const from = fresh ? 0 : prev.get(k);
    if (from == null || isNaN(from) || Math.abs(from - to) < 1e-4) return;
    const delay = fresh ? 80 + Math.min(i++, 30) * 12 : 0, duration = fresh ? 950 : 700;
    const opt = { duration, delay, easing: EASE, fill: 'backwards' };
    if (t === 'ring') {
      const c = Number(el.dataset.c), off = v => (c * (1 - v)).toFixed(2) + 'px';
      el.animate([{ strokeDashoffset: off(from), opacity: from < .004 ? 0 : 1 }, { strokeDashoffset: off(to), opacity: to < .004 ? 0 : 1 }], opt);
      if (!fresh && from < 1 && to >= 1) done.push(el.closest('svg'));
    } else if (t === 'bar') el.animate([{ width: from * 100 + '%' }, { width: to * 100 + '%' }], opt);
    else if (t === 'num') countUp(el, from, to, duration, delay);
  });
  done.forEach(svg => {
    svg.classList.remove('burst'); void svg.getBoundingClientRect(); svg.classList.add('burst');
    svg.closest('.counter-row')?.classList.add('reach');
  });
  return done.length;
}

function confetti(origin) {
  if (RM.matches || !origin) return;
  const r = origin.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const layer = document.createElement('div');
  layer.className = 'confetti'; layer.setAttribute('aria-hidden', 'true');
  document.body.appendChild(layer);
  const cs = getComputedStyle(document.documentElement), colors = ['--c-trabalho', '--c-saude', '--c-estudos', '--c-habitos', '--ok'].map(v => cs.getPropertyValue(v).trim());
  for (let n = 0; n < 34; n++) {
    const s = document.createElement('i'), a = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 110;
    s.style.cssText = `left:${cx}px;top:${cy}px;background:${colors[n % colors.length]};${n % 3 ? '' : 'border-radius:50%;'}`;
    layer.appendChild(s);
    s.animate([
      { transform: 'translate(-50%,-50%) scale(.4) rotate(0deg)', opacity: 1 },
      { transform: `translate(${Math.cos(a) * dist}px, ${Math.sin(a) * dist - 40}px) scale(1) rotate(${Math.random() * 540}deg)`, opacity: 1, offset: .55 },
      { transform: `translate(${Math.cos(a) * dist * 1.15}px, ${Math.sin(a) * dist + 90}px) scale(.8) rotate(${Math.random() * 720}deg)`, opacity: 0 }
    ], { duration: 1100 + Math.random() * 500, easing: 'cubic-bezier(.15,.7,.3,1)', fill: 'forwards' });
  }
  setTimeout(() => layer.remove(), 1800);
}

const BACKUP_KEY = 'painelSemanal.lastBackup', SNOOZE_KEY = 'painelSemanal.backupSnooze';
const daysSince = iso => iso ? Math.round((parseDate(todayISO()) - parseDate(iso)) / 864e5) : Infinity;
function backupDue() {
  if (!state.history.length) return false;
  return daysSince(localStorage.getItem(BACKUP_KEY)) >= 30 && daysSince(localStorage.getItem(SNOOZE_KEY)) >= 7;
}

function banners() {

function render() {
  if (!state.week.days[ui.day]) ui.day = defaultDay();

  const fresh = ui.lastTab !== ui.tab, prev = fresh ? null : snapshot();
  app.innerHTML = banners() + views[ui.tab]();
  app.classList.remove('anim', 'slide-l', 'slide-r');
  if (fresh || ui.slide) { void app.offsetWidth; app.classList.add(fresh ? 'anim' : 'slide-' + ui.slide); }
  ui.lastTab = ui.tab; ui.slide = null;
  const title = ui.tab === 'dia' ? (ui.day === todayISO() ? 'Hoje' : WD_LONG[weekdayIdx(ui.day)]) : TAB_TITLE[ui.tab];
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('navTitle').textContent = title;
  document.querySelectorAll('nav.tabs button').forEach(b => {
    if (b.dataset.tab === ui.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  document.getElementById('weekRange').textContent = `Semana ${fmtBR(state.week.start)} – ${fmtBR(weekEnd())}`;
  const th = THEME_UI[state.settings.theme] || THEME_UI.auto, tb = document.getElementById('themeBtn');
  if (tb.dataset.t !== state.settings.theme) { tb.innerHTML = th.svg; tb.dataset.t = state.settings.theme; }
  tb.setAttribute('aria-label', `Tema: ${th.name}. Tocar para alternar`);

  if (ui.pop) {
    const el = document.querySelector(`[data-fk="${CSS.escape(ui.pop)}"]`);
    if (el) el.classList.add(el.classList.contains('done') || el.classList.contains('counter-row') ? 'pop' : 'unpop');
    ui.pop = null;
  }
  const completed = morph(prev, fresh);
  // Dia inteiro fechado agora há pouco → confete 🎉
  const dp = ui.tab === 'dia' ? dayPct(dayAreas(ui.day)) : null;
  if (!fresh && ui.tab === 'dia' && ui.lastPct?.day === ui.day && ui.lastPct.pct < 1 && dp >= 1) {
    setTimeout(() => confetti(app.querySelector('.hero .rings')), 350);
    haptic(true); toast('Dia completo! 🎉 Mandou bem');
  } else if (completed && ui.didToggle) haptic(true);
  ui.lastPct = { day: ui.day, pct: dp ?? 0 };
  ui.didToggle = false;
}

function commit(popKey) {
  save();
  if (popKey) { ui.pop = popKey; ui.didToggle = true; haptic(); }
  render();
  queueWidgetSync();
}

let toastTimer;
function toast(msg) {

function applyTheme() {
  const t = state.settings.theme;
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#000000' : '#f2f2f7');
}

/* ============================== Ações ============================== */
function moveItem(list, id, dir) {
  const i = list.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
}

app.addEventListener('click', e => {

app.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.edit !== undefined || el.dataset.editIcon !== undefined) {
    const key = el.dataset.edit ?? el.dataset.editIcon, list = getList(key, true), it = list?.find(x => x.id === el.dataset.id);
    if (!it) return;
    const v = el.value.trim();
    if (el.dataset.editIcon !== undefined) it.icon = v;
    else if (!v) { el.value = it.text ?? it.label; return toast('O texto não pode ficar vazio'); }
    else if ('label' in it && !('text' in it)) it.label = v; else it.text = v;
    commit(); toast('Salvo');
  } else if (el.dataset.editArea !== undefined) {
    const it = getList(el.dataset.editArea)?.find(x => x.id === el.dataset.id);
    if (it) { it.area = el.value; commit(); toast('Salvo'); }
  } else if (el.dataset.setting) {
    const k = el.dataset.setting, s = state.settings;
    if (k.startsWith('study:')) {
      const v = Number(el.value); if (!(v >= 0)) return render();
      s.studySplit[Number(k.slice(6))].hours = v;
    } else if (k === 'waterGoalLiters' || k === 'bottleLiters') {
      const v = Number(el.value); if (!(v > 0)) return render();
      s[k] = v;
    } else if (k === 'workStartTime' || k === 'wakeTarget') {
      if (!/^\d{2}:\d{2}$/.test(el.value)) return render();
      s[k] = el.value;
    } else s[k] = el.value;
    if (k === 'theme') applyTheme();
    commit(); toast('Preferência salva');
  }
});

app.addEventListener('submit', e => {
  const wf = e.target.closest('form[data-widget-connect]');
  if (wf) { e.preventDefault(); connectWidget(String(new FormData(wf).get('token') || '')); return; }
  const form = e.target.closest('form[data-add]');
  if (!form) return;
  e.preventDefault();
  const fd = new FormData(form), text = String(fd.get('text') || '').trim();
  if (!text) return;
  const key = form.dataset.add, list = getList(key, true);
  if (!list) return;
  const kind = key.split(':')[0], item = { id: uid() };
  if (kind === 'habits') Object.assign(item, { icon: String(fd.get('icon') || '').trim() || '⭐', label: text, type: 'check', when: fd.get('when') || 'all', enabled: true, custom: true });
  else if (kind === 'goals') Object.assign(item, { area: fd.get('area') || 'trabalho', text });
  else if (kind === 'demands') Object.assign(item, { text, done: false });
  else Object.assign(item, { text }, fd.get('icon') ? { icon: String(fd.get('icon')).trim() } : {});
  list.push(item);
  const inputId = form.querySelector('input[name=text]')?.id;
  commit();
  toast('Adicionado');
  if (inputId) document.getElementById(inputId)?.focus({ preventScroll: true });
});

const dlg = document.getElementById('newWeekDlg'), dlgForm = document.getElementById('newWeekForm');
function openNewWeek() {

  const pend = [];
